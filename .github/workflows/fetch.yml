name: Fetch feeds
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Tokyo'
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
      - run: ruby rss_fetch.rb --max-age-days 1 news.feeds.opml > news.json
      - uses: actions/upload-artifact@v7
        with:
          name: news.json
          path: news.json
          retention-days: 1
          overwrite: true
          archive: false

name: Fetch feeds
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
      - run: ruby rss_fetch.rb --max-age-days 1 news.feeds.opml > _site/news.json
        continue-on-error: true
      - run: ruby rss_fetch.rb --max-age-days 1 security.feeds.opml > _site/security.json
        continue-on-error: true
      - run: ruby rss_fetch.rb --max-age-days 1 tech_en.feeds.opml > _site/tech_en.json
        continue-on-error: true
      - run: ruby rss_fetch.rb --max-age-days 1 tech_ja_company.feeds.opml > _site/tech_ja_company.json
        continue-on-error: true
      - run: ruby rss_fetch.rb --max-age-days 1 tech_ja_personal.feeds.opml > _site/tech_ja_personal.json
        continue-on-error: true
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - uses: actions/deploy-pages@v5
        id: deployment
